<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 — 欢乐斗地主</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="card">
            <div class="card-title">
                <span class="icon">&#x1f4dd;</span>
                用户注册
            </div>

            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" id="regUsername" class="form-input" placeholder="请输入用户名">
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="regPassword" class="form-input" placeholder="请输入密码（至少6位）">
            </div>

            <div class="form-group">
                <label class="form-label">确认密码</label>
                <input type="password" id="regConfirm" class="form-input" placeholder="请再次输入密码">
            </div>

            <button class="btn btn-green btn-block" onclick="register()">注 册</button>

            <div id="message" class="message"></div>

            <div class="sub-link">
                已有账号？<a href="/">立即登录</a>
            </div>
        </div>
    </div>

    <script>
        function showMessage(text, isSuccess) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + (isSuccess ? 'success' : 'error');
        }

        function register() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            if (!username || !password) { showMessage('用户名和密码不能为空！', false); return; }
            if (password.length < 6) { showMessage('密码长度至少6位！', false); return; }
            if (password !== confirm) { showMessage('两次密码不一致！', false); return; }

            fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                showMessage(data.message, data.success);
                if (data.success) setTimeout(() => window.location.href = '/', 1500);
            })
            .catch(() => showMessage('网络错误，请稍后重试！', false));
        }

        document.addEventListener('keypress', e => { if (e.key === 'Enter') register(); });
    </script>
</body>
</html>
