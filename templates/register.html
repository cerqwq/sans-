<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗地主 - 注册</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page-center">
        <div class="card" style="width:380px;max-width:90%;">
            <h1 style="text-align:center;font-size:26px;margin-bottom:28px;">📝 用户注册</h1>

            <div class="form-group">
                <label class="form-label">用户名</label>
                <input type="text" class="form-input" id="regUsername" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="regPassword" placeholder="至少6位">
            </div>
            <div class="form-group">
                <label class="form-label">确认密码</label>
                <input type="password" class="form-input" id="regConfirm" placeholder="再次输入密码">
            </div>

            <button class="btn btn-green btn-block btn-lg" onclick="register()">注 册</button>

            <div style="text-align:center;margin-top:16px;">
                <span style="color:var(--text-muted);font-size:13px;">已有账号？</span>
                <a href="/" style="color:var(--blue);font-size:13px;text-decoration:none;font-weight:600;">立即登录</a>
            </div>

            <div id="msg" class="toast" style="position:static;margin-top:16px;display:none;transform:none;"></div>
        </div>
    </div>

    <script>
        function showMsg(text, ok) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'toast show ' + (ok ? 'success' : 'error');
            el.style.display = 'block';
        }

        function register() {
            const u = document.getElementById('regUsername').value.trim();
            const p = document.getElementById('regPassword').value;
            const c = document.getElementById('regConfirm').value;

            if (!u || !p) { showMsg('用户名和密码不能为空！', false); return; }
            if (p.length < 6) { showMsg('密码长度至少6位！', false); return; }
            if (p !== c) { showMsg('两次密码不一致！', false); return; }

            fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            })
            .then(r => r.json())
            .then(d => {
                showMsg(d.message, d.success);
                if (d.success) setTimeout(() => window.location.href = '/', 1500);
            })
            .catch(() => showMsg('网络错误！', false));
        }

        document.addEventListener('keypress', e => { if (e.key === 'Enter') register(); });
    </script>
</body>
</html>
