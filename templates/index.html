<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 — 欢乐斗地主</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page-wrapper">
        <div class="card">
            <div class="card-title">
                <span class="icon">&#x1f510;</span>
                用户登录
            </div>

            <div class="form-group">
                <label class="form-label">账号</label>
                <input type="text" id="username" class="form-input" placeholder="请输入账号" autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" id="password" class="form-input" placeholder="请输入密码" autocomplete="current-password">
            </div>

            <button class="btn btn-gold btn-block" onclick="login()">登 录</button>

            <div class="sub-link">
                还没有账号？<a href="/register_page">立即注册</a>
            </div>

            <div class="hint">
                登录后会自动打开新标签页，<span>可继续登录其他账号</span>
            </div>

            <div id="message" class="message"></div>
        </div>
    </div>

    <script>
        function showMessage(text, isSuccess) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + (isSuccess ? 'success' : 'error');
        }

        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showMessage('请输入账号和密码！', false);
                return;
            }

            fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(r => r.json())
            .then(data => {
                showMessage(data.message, data.success);
                if (data.success) {
                    setTimeout(() => {
                        window.open('/nav', '_blank');
                        document.getElementById('username').value = '';
                        document.getElementById('password').value = '';
                        showMessage('登录成功！已在新标签页打开', true);
                    }, 500);
                }
            })
            .catch(() => showMessage('网络错误，请稍后重试！', false));
        }

        document.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
