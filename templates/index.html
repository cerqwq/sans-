<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗地主 - 登录</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page-center">
        <div class="card" style="width:380px;max-width:90%;">
            <h1 style="text-align:center;font-size:26px;margin-bottom:6px;">🃏 欢乐斗地主</h1>
            <p style="text-align:center;color:var(--text-dim);font-size:13px;margin-bottom:28px;">登录你的账号开始游戏</p>

            <div class="form-group">
                <label class="form-label">账号</label>
                <input type="text" class="form-input" id="username" placeholder="请输入账号" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">密码</label>
                <input type="password" class="form-input" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>

            <button class="btn btn-blue btn-block btn-lg" onclick="login()">登 录</button>

            <div style="text-align:center;margin-top:16px;">
                <span style="color:var(--text-muted);font-size:13px;">还没有账号？</span>
                <a href="/register_page" style="color:var(--blue);font-size:13px;text-decoration:none;font-weight:600;">立即注册</a>
            </div>

            <div id="msg" class="toast" style="position:static;margin-top:16px;display:none;transform:none;"></div>
        </div>
    </div>

    <script>
        function showMsg(text, ok) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'toast show ' + (ok ? 'success' : 'error');
            el.style.display = 'block';
        }

        function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            if (!u || !p) { showMsg('请输入账号和密码！', false); return; }

            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: u, password: p})
            })
            .then(r => r.json())
            .then(d => {
                showMsg(d.message, d.success);
                if (d.success) {
                    setTimeout(() => {
                        window.open('/nav', '_blank');
                        document.getElementById('username').value = '';
                        document.getElementById('password').value = '';
                        document.getElementById('msg').style.display = 'none';
                    }, 500);
                }
            })
            .catch(() => showMsg('网络错误！', false));
        }

        document.addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
