<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航 — 欢乐斗地主</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="nav-page">
        <div class="nav-header">
            <div>
                <h1>&#x1f310; 导航中心</h1>
                <p>请选择你要进入的功能</p>
            </div>
            <div class="nav-header-actions">
                <a href="/switch_account" class="btn btn-ghost btn-sm">切换账号</a>
                <a href="/logout" class="btn btn-red btn-sm">退出登录</a>
            </div>
        </div>

        <div class="nav-grid">
            <div class="nav-card" onclick="location.href='/doudizhu'">
                <div class="card-icon">&#x1f0cf;</div>
                <h2>斗地主</h2>
                <p>经典扑克游戏，与电脑 AI 对战，赢取金币</p>
                <button class="btn btn-blue btn-sm">开始游戏 &rarr;</button>
            </div>

            <div class="nav-card" onclick="location.href='/lobby'">
                <div class="card-icon">&#x1f310;</div>
                <h2>联机大厅</h2>
                <p>创建房间或加入好友房间，在线实时对战</p>
                <button class="btn btn-green btn-sm">进入大厅 &rarr;</button>
            </div>

            <div class="nav-card" onclick="location.href='/profile'">
                <div class="card-icon">&#x1f464;</div>
                <h2>个人中心</h2>
                <p>查看账号信息、游戏数据和战绩统计</p>
                <button class="btn btn-gold btn-sm">查看 &rarr;</button>
            </div>

            <div class="nav-card" onclick="location.href='/admin_login'">
                <div class="card-icon">&#x2699;&#xfe0f;</div>
                <h2>管理后台</h2>
                <p>管理用户数据，查看和修改金币等游戏数据</p>
                <button class="btn btn-ghost btn-sm">进入后台 &rarr;</button>
            </div>
        </div>
    </div>
</body>
</html>
