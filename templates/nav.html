<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航中心</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body style="background:linear-gradient(135deg,#0d1b2a,#1a2a4a);">
    <div class="page-wrapper">
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;">
            <div>
                <h1 style="font-size:24px;">🌐 导航中心</h1>
                <p style="color:var(--text-dim);font-size:13px;margin-top:4px;">欢迎，{{ username }}！选择你要玩的游戏</p>
            </div>
            <div style="display:flex;gap:8px;">
                <a href="/switch_account" class="btn btn-ghost btn-sm">切换账号</a>
                <a href="/logout" class="btn btn-red btn-sm">退出</a>
            </div>
        </div>

        <div class="nav-grid">
            <div class="nav-card" onclick="location.href='/doudizhu'">
                <div class="nav-card-icon">🃏</div>
                <div class="nav-card-title">单机斗地主</div>
                <div class="nav-card-desc">与电脑AI对战，赢取金币！</div>
                <button class="btn btn-blue btn-sm" style="margin-top:16px;">开始游戏 →</button>
            </div>
            <div class="nav-card" onclick="location.href='/lobby'">
                <div class="nav-card-icon">🌐</div>
                <div class="nav-card-title">联机大厅</div>
                <div class="nav-card-desc">创建或加入房间，在线对战</div>
                <button class="btn btn-green btn-sm" style="margin-top:16px;">进入大厅 →</button>
            </div>
            <div class="nav-card" onclick="location.href='/profile'">
                <div class="nav-card-icon">👤</div>
                <div class="nav-card-title">个人中心</div>
                <div class="nav-card-desc">查看战绩、金币和统计数据</div>
                <button class="btn btn-ghost btn-sm" style="margin-top:16px;">查看 →</button>
            </div>
            <div class="nav-card" onclick="location.href='/admin_login'">
                <div class="nav-card-icon">⚙️</div>
                <div class="nav-card-title">管理后台</div>
                <div class="nav-card-desc">管理用户数据和游戏设置</div>
                <button class="btn btn-ghost btn-sm" style="margin-top:16px;">进入 →</button>
            </div>
        </div>
    </div>
</body>
</html>
